/**
 * 解析 Master M3U8 並提取最高畫質/頻寬的 Variant Stream 網址
 * @param {string} masterUrl - Master Playlist 網址
 * @returns {Promise<{url: string, bandwidth: number, resolution: string}|null>}
 */
async function getHighestResM3u8(masterUrl) {
    try {
        console.log(`📡 正在下載 Master Playlist: ${masterUrl}`);
        const response = await fetch(masterUrl, {
            headers: {
                'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'
            }
        });

        if (!response.ok) {
            throw new Error(`HTTP 錯誤，狀態碼: ${response.status}`);
        }

        const m3u8Content = await response.text();
        
        const lines = m3u8Content.split(/\r?\n/);
        let maxBandwidth = -1;
        let maxResolution = '未知';
        let bestStreamUrl = null;

        let currentBandwidth = 0;
        let currentResolution = '';

        for (let i = 0; i < lines.length; i++) {
            const line = lines[i].trim();

            if (line.startsWith('#EXT-X-STREAM-INF:')) {
                // 提取 BANDWIDTH 數值
                const bwMatch = line.match(/BANDWIDTH=(\d+)/);
                if (bwMatch) {
                    currentBandwidth = parseInt(bwMatch[1], 10);
                }

                // 提取 RESOLUTION 數值 (例如: 1920x1080)
                const resMatch = line.match(/RESOLUTION=([0-9x]+)/);
                if (resMatch) {
                    currentResolution = resMatch[1];
                }
            } else if (line && !line.startsWith('#')) {
                // 找到對應的子串流相對或絕對路徑
                if (currentBandwidth > maxBandwidth) {
                    maxBandwidth = currentBandwidth;
                    maxResolution = currentResolution || maxResolution;
                    
                    // 使用 URL 類別處理相對路徑拼接 (Relative Path Resolution)
                    bestStreamUrl = new URL(line, masterUrl).href;
                }
                
                // 重設暫存變數
                currentBandwidth = 0;
                currentResolution = '';
            }
        }

        if (!bestStreamUrl) {
            throw new Error('未能在 Master Playlist 中找到任何有效的 Variant Stream！');
        }

        return {
            url: bestStreamUrl,
            bandwidth: maxBandwidth,
            resolution: maxResolution
        };

    } catch (error) {
        console.error('❌ 解析過程發生錯誤:', error.message);
        return null;
    }
}

function chUrl(asset_id, media_type, callback)
{
    asset_id = decodeURIComponent(asset_id);
    asset_id = asset_id.replace("#","%23");
    url = `https://cdi.ofiii.com/ofiii_cdi/video/urls?device_type=pc&device_id=9fca4871-d629-4aec-8863-39b17527d67a&media_type=${media_type}&asset_id=${asset_id}`
    fetch(url)
    .then(response => {
        if (response.ok) return response.text()        
        throw new Error('Network response was not ok.')
    })
    .then(data => {
        var j = JSON.parse(data);
        var Url = j.asset_urls[0];
        console.log(Url);
        // location.href = 'dpplayer.html?url='+Url;
        // location.href = Url;
        
        loadHLSStream(Url);

    });
}


// get params
(window.onpopstate = function () {
    var match,
        pl     = /\+/g,  // Regex for replacing addition symbol with a space
        search = /([^&=]+)=?([^&]*)/g,
        decode = function (s) { return decodeURIComponent(s.replace(pl, " ")); },
        query  = window.location.search.substring(1);

    urlParams = {};
    while (match = search.exec(query))
        urlParams[decode(match[1])] = decode(match[2]);
})();

if (urlParams["content_type"] == null){urlParams["content_type"]='channel'}

if (urlParams["asset_id"] != null && urlParams["content_type"] != null) { 
    chUrl(urlParams["asset_id"], urlParams["content_type"]);  
}
